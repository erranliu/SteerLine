  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;sl-viz&#x27;);
      const live = document.getElementById(&#x27;sl-live&#x27;);
      const choices = { density: &#x27;comfortable&#x27;, layout: &#x27;context&#x27;, reviewState: &#x27;ready&#x27;, accent: &#x27;#0d7770&#x27; };
      const saved = window.openai?.widgetState;
      if (saved?.privateContent?.page &amp;&amp; [&#x27;plan&#x27;,&#x27;roadmap&#x27;,&#x27;dag&#x27;,&#x27;runs&#x27;,&#x27;review&#x27;].includes(saved.privateContent.page)) root.dataset.page = saved.privateContent.page;
      function persist() {
        const savedState = window.openai?.setWidgetState?.({ modelContent: { viewedPage: root.dataset.page }, privateContent: { page: root.dataset.page } });
        savedState?.catch?.(() =&gt; {});
      }
      function renderOptions() {
        root.dataset.density = choices.density;
        root.dataset.layout = choices.layout;
        root.dataset.reviewState = choices.reviewState;
        root.style.setProperty(&#x27;--sl-accent&#x27;, choices.accent);
      }
      function renderPage(page) {
        root.dataset.dialog = &#x27;none&#x27;;
        root.dataset.page = page;
        root.querySelectorAll(&#x27;[data-nav]&#x27;).forEach(b =&gt; b.classList.toggle(&#x27;active&#x27;, b.dataset.nav === page));
        live.textContent = ({ plan: &#x27;规划工作台&#x27;, roadmap: &#x27;Roadmap&#x27;, dag: &#x27;任务 DAG&#x27;, runs: &#x27;执行与待处理&#x27;, review: &#x27;审阅文档变更&#x27; })[page] + &#x27;页面&#x27;;
        persist();
      }
      root.addEventListener(&#x27;click&#x27;, e =&gt; {
        const nav = e.target.closest(&#x27;[data-nav]&#x27;);
        if (nav &amp;&amp; root.contains(nav)) { renderPage(nav.dataset.nav); return; }
        const ctx = e.target.closest(&#x27;[data-context]&#x27;);
        if (ctx &amp;&amp; root.contains(ctx)) {
          root.querySelectorAll(&#x27;[data-context]&#x27;).forEach(b =&gt; b.classList.toggle(&#x27;active&#x27;, b === ctx));
          root.querySelectorAll(&#x27;[data-context-panel]&#x27;).forEach(p =&gt; p.hidden = p.dataset.contextPanel !== ctx.dataset.context);
          return;
        }
        const task = e.target.closest(&#x27;[data-task]&#x27;);
        if (task &amp;&amp; root.contains(task)) {
